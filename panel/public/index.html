<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Road Builder</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>Road Builder</h1>
  <span id="dot" class="dot" title="Connection to VectorCraft"></span>
  <label class="agent">Agent <select id="agent"></select></label>
</header>

<main>
  <p id="problem" class="problem" hidden></p>

  <section id="context" class="card"></section>

  <section id="modeCard" class="card" hidden>
    <fieldset class="mode">
      <label><input type="radio" name="mode" value="road" checked> A road</label>
      <label><input type="radio" name="mode" value="connection"> A connection between two roads</label>
    </fieldset>
    <div id="matchRow" class="row" hidden>
      <button id="match" class="plain">Connect and match: carry the road across</button>
    </div>
  </section>

  <section id="junctionCard" class="card" hidden>
    <h2 id="jtitle">Junction</h2>
    <p id="jasked" class="muted asked" hidden></p>
    <p id="jsummary"></p>
    <ol id="jlegs" class="items"></ol>
    <div class="row wrap">
      <label>Control <select id="jcontrol"><option value="none">none</option><option value="signal">traffic signals</option><option value="stop">stop signs</option></select></label>
      <label><input type="checkbox" id="jcross"> Crosswalks</label>
    </div>
    <div class="row"><button id="jcancel" class="plain" hidden>Cancel</button></div>
  </section>

  <section id="crossingCard" class="card" hidden>
    <h2 id="ctitle">Intersection</h2>
    <p id="casked" class="muted asked" hidden></p>
    <p id="csummary"></p>
    <div class="row wrap">
      <label>What happens where they cross
        <select id="ctreat">
          <option value="signal">Lighted intersection (traffic signals)</option>
          <option value="two-way-stop">Two-way stop (the side road stops)</option>
          <option value="four-way-stop">Four-way stop</option>
          <option value="uncontrolled">No control</option>
          <option value="overpass">Overpass / underpass</option>
          <option value="roundabout">Roundabout</option>
          <option value="cloverleaf">Cloverleaf (not built yet)</option>
        </select>
      </label>
    </div>
    <div class="row wrap">
      <label id="cminorRow" hidden>Road that stops <select id="cminor"></select></label>
      <label id="coverRow" hidden>Road on top <select id="cover"></select></label>
      <label id="cdiaRow" hidden>Width <input id="cdia" type="number" min="20" max="120" step="2" value="40"> m</label>
      <label id="ccrossRow"><input type="checkbox" id="ccross"> Crosswalks</label>
    </div>
    <div class="row"><button id="ccancel" class="plain" hidden>Cancel</button></div>
  </section>

  <section id="road" class="card" hidden>
    <div id="bar" class="bar" aria-label="Cross-section to scale"></div>
    <ol id="items" class="items"></ol>
    <p id="total" class="muted"></p>
  </section>

  <section id="proposal" class="card proposal" hidden>
    <h2>Proposed change</h2>
    <p id="asked" class="muted asked"></p>
    <div id="pbar" class="bar"></div>
    <ol id="pitems" class="items"></ol>
    <p id="ptotal" class="muted"></p>
    <div class="row">
      <button id="cancel" class="plain">Cancel</button>
    </div>
  </section>

  <section class="card">
    <label for="words" id="wordsLabel">Describe the road, or the change you want</label>
    <textarea id="words" rows="3" placeholder="e.g. a bike lane, an apron, two south lanes, a 3 m grassy curbed margin, two north lanes, apron, bike lane"></textarea>
    <div class="row">
      <button id="propose">Propose</button>
      <span id="thinking" class="muted" hidden>Thinking…</span>
    </div>
    <details>
      <summary>Type the shorthand yourself</summary>
      <input id="shorthand" type="text" spellcheck="false" placeholder="facing N: bike-lane | lane S x2 | margin 3 | lane N x2 | bike-lane">
      <button id="use" class="plain">Use this</button>
      <p class="muted">Elements: lane, turn-pocket, bike-lane, apron, shoulder, margin, median, sidewalk, parking-lane … Direction N S E W, width 3 or 10ft, repeat x2.</p>
    </details>
  </section>

  <section class="card draw">
    <fieldset id="scope" hidden>
      <label><input type="radio" name="scope" value="segment" checked> <span id="scope-all">All pieces of this road</span></label>
      <label><input type="radio" name="scope" value="selected"> Only the selected piece</label>
    </fieldset>
    <button id="draw" class="primary">Draw</button>
    <p id="message" class="message" role="status"></p>
  </section>
</main>
<script src="/app.js" type="module"></script>
</body>
</html>
